# Orange Pi Zero 3 (H618) - Ultra Minimal Generic Base
# Use as base for any H618 board - swap DTB/kernel as needed
BOARD_NAME="Orange Pi Zero 3 H618 Minimal"
BOARD_VENDOR="xunlong"
BOARDFAMILY="sun50iw9"
BOARD_MAINTAINER="custom"
INTRODUCED="2023"
BOOTCONFIG="orangepi_zero3_defconfig"
BOOT_LOGO="no"
OVERLAY_PREFIX="sun50i-h616"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
FORCE_BOOTSCRIPT_UPDATE="yes"

# Ultra minimal - no desktop
BUILD_DESKTOP="no"
BUILD_MINIMAL="yes"
FULL_DESKTOP="no"
HAS_VIDEO_OUTPUT="no"

# ONLY real essentials - dropbear instead of openssh, iwd instead of wpa_supplicant
PACKAGE_LIST_BOARD="
    apparmor
    dropbear
    iwd
    vim
    htop
    curl
    wget
    git
    rsync
    cron
    logrotate
    net-tools
    python3
    python3-pip
    python3-venv
    nftables
    tree
    jq
"

# Remove ALL bloat
PACKAGE_LIST_BOARD_REMOVE="
    nano
    snapd
    modemmanager
    blueman
    network-manager-gnome
    gnome-*
    libreoffice*
    thunderbird*
    transmission*
    xserver-xorg*
    lightdm*
    xfce*
    xubuntu*
    openssh-server
    openssh-client
    ssh
    wpasupplicant
    docker.io
    docker-compose*
    containerd
    runc
    fail2ban
    snapd
    polkitd
    accountsservice
    rtkit
    colord
    avahi-daemon
    cups*
    bluetooth*
    bluez*
    pulseaudio*
    pipewire*
    network-manager
    modemmanager
"

# NOTE: For other H618 boards, change BOOT_FDT_FILE to match:
#   orangepizero2w:     sun50i-h618-orangepi-zero2w.dtb
#   bananapim4zero:     sun50i-h618-bananapi-m4-zero.dtb
#   walnutpi-1b:        sun50i-h618-walnutpi-1b.dtb
#   walnutpi-box:       sun50i-h618-walnutpi-box.dtb
#   longanpi-3h:        sun50i-h618-longanpi-3h.dtb
#   kickpik2b:          sun50i-h618-kickpi-k2b.dtb
#   bananapim4berry:    sun50i-h618-bananapi-m4-berry.dtb
